<header class="site-header">
  <div class="container navbar">
    <a class="brand" href="index.html" data-path="index.html"
       aria-label="GameCore home">
      <i class="bi bi-controller brand-icon" aria-hidden="true"></i>
      <span class="brand-text">Game<span>Core</span></span>
    </a>

    <button class="menu-toggle" id="menu-toggle" type="button"
            aria-label="Open navigation menu"
            aria-expanded="false" aria-controls="main-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-content" id="main-menu">
      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html"
           data-path="index.html" data-page="home">Home</a>

        <a class="nav-link" href="pages/consoles.html"
           data-path="pages/consoles.html"
           data-page="consoles">Consoles</a>

        <a class="nav-link" href="pages/games.html"
           data-path="pages/games.html" data-page="games">Games</a>

        <a class="nav-link" href="pages/accessories.html"
           data-path="pages/accessories.html"
           data-page="accessories">Accessories</a>

        <a class="nav-link" href="pages/deals.html"
           data-path="pages/deals.html" data-page="deals">Deals</a>
      </nav>

      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="site-search">Search products</label>

        <i class="bi bi-search icon" aria-hidden="true"></i>
        <input id="site-search" name="q" type="search"
               placeholder="Search products...">

        <button class="sr-only" type="submit">Search</button>
      </form>
    </div>

    <div class="header-actions">
      <a class="sign-in-link" id="account-link"
         href="pages/login.html" data-path="pages/login.html">
        <i class="bi bi-person icon" aria-hidden="true"></i>
        <span id="account-text">Sign In</span>
      </a>

      <a class="sign-up-link" id="signup-link"
         href="pages/register.html" data-path="pages/register.html">
        <i class="bi bi-person-plus icon" aria-hidden="true"></i>
        <span>Sign Up</span>
      </a>

      <button class="logout-button" id="logout-button"
              type="button" hidden>
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        <span>Logout</span>
      </button>

      <a class="cart-link" id="cart-link"
         href="pages/cart.html" data-path="pages/cart.html"
         aria-label="Shopping cart, 0 items">
        <i class="bi bi-cart3 icon" aria-hidden="true"></i>
        <span>Cart</span>
        <span class="cart-badge" id="cart-count">0</span>
      </a>

      <a class="admin-button" id="admin-link" href="pages/admin/products.html"
         data-path="pages/admin/products.html" hidden>
        <i class="bi bi-shield-lock" aria-hidden="true"></i>
        <span>Admin Panel</span>
      </a>
    </div>
  </div>

  <div class="container">
    <p class="header-message" id="header-message"
       role="status" hidden></p>
  </div>
</header>
