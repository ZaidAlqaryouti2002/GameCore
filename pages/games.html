<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameCore | Games</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style/layout.css">
  <link rel="stylesheet" href="../style/style.css">
  <link rel="stylesheet" href="../style/catalog.css">
</head>
<body data-page="games" data-category="games" data-catalog="true">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Loaded from components/topbar.html by layout.js -->
  <div id="topbar-container"></div>

  <main class="container page-content catalog-content" id="main-content">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><i class="bi bi-chevron-right" aria-hidden="true"></i><span aria-current="page">Games</span></nav>
    <section class="catalog-banner" aria-labelledby="banner-title">
      <h1 id="banner-title">Games</h1>
      <p>Epic adventures. Unforgettable worlds. Discover your next favorite game for PlayStation, Xbox, Nintendo and PC.</p>
    </section>

    <div class="catalog-layout">
      <aside class="filters-panel" aria-labelledby="filters-title">
        <form id="catalog-filters">
          <div class="filters-heading"><h2 id="filters-title">Filters</h2><button class="reset-filters" type="reset">Reset all</button></div>
          <fieldset><legend>Genre</legend><div id="genre-options"></div></fieldset>
          <fieldset><legend>Platform</legend><div id="platform-options"></div></fieldset>
          <p class="filter-hint">All games: <span id="catalog-count">0</span></p>
          <fieldset><legend>Brand</legend><div id="brand-options"><p class="filter-hint">Loading brands...</p></div></fieldset>
          <fieldset><legend>Price range</legend><div class="price-inputs">
            <label>Min ($)<input id="min-price" type="number" min="0" step="0.01" placeholder="0"></label>
            <label>Max ($)<input id="max-price" type="number" min="0" step="0.01" placeholder="Any"></label>
          </div></fieldset>
          <fieldset><legend>Availability</legend>
            <label class="filter-option"><input type="checkbox" name="availability" value="in"> In stock <span id="in-stock-count">0</span></label>
            <label class="filter-option"><input type="checkbox" name="availability" value="out"> Out of stock <span id="out-stock-count">0</span></label>
          </fieldset>
          <p class="filter-error" id="filter-error" role="alert" hidden></p>
          <button class="apply-filters" type="submit">Apply Filters</button>
        </form>
      </aside>

      <section class="catalog-results" aria-labelledby="catalog-title">
        <div class="catalog-toolbar">
          <div class="catalog-heading"><h2 id="catalog-title">All Games</h2><p id="results-count" role="status"></p></div>
          <label class="sort-control" for="catalog-sort">Sort by:
            <select id="catalog-sort"><option value="featured">Featured</option><option value="price-low">Price: Low to High</option><option value="price-high">Price: High to Low</option><option value="name">Name: A to Z</option></select>
          </label>
        </div>
        <p id="products-message" role="status">Loading products...</p>
        <button id="catalog-retry" class="apply-filters" type="button" hidden>Try again</button>
        <div class="products-grid" id="products-grid"></div>
        <div class="catalog-bottom"><p id="page-range"></p><nav id="catalog-pagination" aria-label="Product pages"></nav></div>
      </section>
    </div>
  </main>

  <!-- Remove this container on pages that should not have a footer. -->
  <div id="footer-container"></div>

  <noscript><p class="container">Enable JavaScript to load the shared header and footer.</p></noscript>

  <!-- auth.js first, shared layout second, page-specific JavaScript last. -->
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/catalog.js"></script>
</body>
</html>
