<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameCore | Sign In</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style/layout.css">
  <link rel="stylesheet" href="../style/auth.css">
</head>
<body data-page="login">
  <a class="skip-link" href="#account-form">Skip to sign in</a>
  <main class="auth-layout">
    <aside class="auth-banner" id="auth-banner-container" aria-label="GameCore"></aside>
    <section class="auth-panel" aria-labelledby="auth-title">
      <a class="back-to-store" href="../index.html">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to store
      </a>
      <div class="auth-content">
        <header class="auth-heading">
          <h1 id="auth-title">Welcome Back</h1>
          <p>Sign in to GameCore. Get back to what you love.</p>
        </header>
        <form id="account-form">
          <div class="form-field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" autocomplete="username"
              placeholder="Enter your email address" maxlength="254" required>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-field">
              <input id="password" name="password" type="password"
                autocomplete="current-password" placeholder="Enter your password" required>
              <button class="password-toggle" type="button" data-password="password"
                aria-controls="password" aria-label="Show password" aria-pressed="false" title="Show password">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <label class="checkbox-label" for="remember-me">
            <input id="remember-me" name="remember" type="checkbox">
            <span>Remember me</span>
          </label>
          <p class="auth-message" id="form-message" role="status" hidden></p>
          <button class="auth-submit" id="submit-button" type="submit">Sign In</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="register.html">Sign Up</a></p>
      </div>
    </section>
  </main>
  <noscript><p class="container">Enable JavaScript to sign in.</p></noscript>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/account.js"></script>
</body>
</html>
