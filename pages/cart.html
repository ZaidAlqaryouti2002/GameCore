<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameCore | Shopping Cart</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/layout.css">
  <link rel="stylesheet" href="../style/cart.css">
</head>
<body data-page="cart">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Loaded from components/topbar.html by layout.js -->
  <div id="topbar-container"></div>

 <main class="container page-content" id="main-content">
  <h1>Shopping Cart</h1>

  <p id="cart-message">Loading cart...</p>

  <div id="cart-items"></div>

  <div id="cart-summary" hidden>
    <p>Total: <strong id="cart-total">$0.00</strong></p>
  </div>
</main>

  <!-- Remove this container on pages that should not have a footer. -->
  <div id="footer-container"></div>

  <noscript><p class="container">Enable JavaScript to load the shared header and footer.</p></noscript>

  <!-- auth.js first, shared layout second, page-specific JavaScript last. -->
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
